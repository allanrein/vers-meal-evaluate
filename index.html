<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Avaliação do Refeitório - Fazenda Melkstad</title>
    <style>
      /* RESET E ESTILOS BASE */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        user-select: none; /* Impede seleção acidental de texto */
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      body {
        background-color: #f4f0e6; /* Tom creme do fundo */
        color: #1b365d; /* Azul marinho Melkstad */
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      /* CABEÇALHO / LOGO */
      header {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        margin-bottom: 15px;
      }

      .logo {
        width: 140px;
        height: 140px;
        object-fit: contain;
        margin-bottom: 8px;
      }

      h1.title {
        font-size: 1.4rem;
        font-weight: 700;
        color: #1b365d;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .subtitle {
        font-size: 0.9rem;
        color: #555;
        font-style: italic;
      }

      /* CONTAINER DAS PERGUNTAS */
      main.quiz-container {
        width: 100%;
        max-width: 500px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        flex-grow: 1;
        justify-content: center;
      }

      .question-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 16px 12px;
        box-shadow: 0 4px 12px rgba(27, 54, 93, 0.08);
        border: 1px solid #e2dcd0;
        text-align: center;
      }

      .question-title {
        font-size: 1.15rem;
        font-weight: 700;
        color: #1b365d;
        margin-bottom: 12px;
      }

      /* CARINHAS DE AVALIAÇÃO */
      .rating-group {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .rating-btn {
        background: none;
        border: 3px solid transparent;
        border-radius: 50%;
        cursor: pointer;
        padding: 4px;
        transition:
          transform 0.15s ease,
          border-color 0.15s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        outline: none;
        touch-action: manipulation;
      }

      .rating-btn svg {
        width: 54px;
        height: 54px;
      }

      /* Efeito de seleção */
      .rating-btn.selected {
        transform: scale(1.18);
        border-color: #1b365d;
        background-color: rgba(27, 54, 93, 0.05);
      }

      .rating-btn:active {
        transform: scale(0.95);
      }

      .rating-label {
        font-size: 0.7rem;
        font-weight: 600;
        color: #666;
        margin-top: 4px;
      }

      /* BOTÃO ENVIAR */
      footer {
        width: 100%;
        max-width: 500px;
        margin-top: 15px;
      }

      .btn-submit {
        width: 100%;
        background-color: #27ae60;
        color: #ffffff;
        font-size: 1.3rem;
        font-weight: 800;
        border: none;
        padding: 18px;
        border-radius: 14px;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(39, 174, 96, 0.3);
        text-transform: uppercase;
        letter-spacing: 1px;
        transition:
          background-color 0.2s,
          transform 0.1s;
        touch-action: manipulation;
      }

      .btn-submit:active {
        background-color: #219653;
        transform: scale(0.98);
      }

      /* TELA DE AGRADECIMENTO (MODAL) */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(27, 54, 93, 0.95);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: #ffffff;
        text-align: center;
        padding: 20px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
        z-index: 1000;
      }

      .modal-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }

      .modal-icon {
        font-size: 5rem;
        margin-bottom: 20px;
      }

      .modal-title {
        font-size: 2.2rem;
        margin-bottom: 10px;
        font-weight: 800;
      }

      .modal-text {
        font-size: 1.2rem;
        opacity: 0.9;
      }
    </style>
  </head>

    <!-- RODAPÉ -->

      <button class="btn-submit" id="btnSubmit">Enviar Avaliação</button>

    <!-- TELA DE OBRIGADO -->
    <div class="modal-overlay" id="thankYouModal">
      <div class="modal-icon">👍</div>
      <h2 class="modal-title">Muito Obrigado!</h2>
      <p class="modal-text">Sua avaliação foi registrada com sucesso.</p>
    </div>

    <!-- INTERATIVIDADE (JAVASCRIPT) -->
    <script>
      const answers = {
        sabor: null,
        variedade: null,
        atendimento: null,
      };

      // Lógica para seleção das carinhas
      document.querySelectorAll(".rating-group").forEach((group) => {
        const questionKey = group.dataset.question;
        const buttons = group.querySelectorAll(".rating-btn");

        buttons.forEach((btn) => {
          btn.addEventListener("click", () => {
            buttons.forEach((b) => b.classList.remove("selected"));
            btn.classList.add("selected");
            answers[questionKey] = btn.dataset.value;
          });
        });
      });

      // Envios e Reset Automático
      const btnSubmit = document.getElementById("btnSubmit");
      const modal = document.getElementById("thankYouModal");

      btnSubmit.addEventListener("click", () => {
        // Validação rápida (opcional)
        if (!answers.sabor || !answers.variedade || !answers.atendimento) {
          alert("Por favor, responda às 3 perguntas antes de enviar.");
          return;
        }

        console.log("Dados salvos:", answers);

        // Exibe tela de agradecimento
        modal.classList.add("active");

        // Reseta a tela em 2.5 segundos para o próximo colaborador
        setTimeout(() => {
          modal.classList.remove("active");
          document
            .querySelectorAll(".rating-btn")
            .forEach((b) => b.classList.remove("selected"));
          answers.sabor = null;
          answers.variedade = null;
          answers.atendimento = null;
        }, 2500);
      });
    </script>
